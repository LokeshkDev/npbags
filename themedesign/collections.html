<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Collections — Everyday, Elevated | Shop Handcrafted Bags & Accessories</title>
  <meta name="description" content="Explore our complete collection of everyday essentials, organic canvas totes, sleek city crossbodies, commuter backpacks, and weekend travel duffels. Enjoy complimentary delivery across India on orders over ₹499.">
  <meta name="keywords" content="tote bags, crossbody bags, travel duffels, backpacks, canvas wash bag, cardholders, minimalist watches, shop collection">
  <link rel="canonical" href="collections.html">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/brand-logo.png">
  <link rel="apple-touch-icon" href="assets/brand-logo.png">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="collections.html">
  <meta property="og:title" content="Collections — Everyday, Elevated | Shop Handcrafted Bags & Accessories">
  <meta property="og:description" content="Explore our complete collection of everyday essentials, organic canvas totes, sleek city crossbodies, commuter backpacks, and weekend travel duffels. Enjoy complimentary delivery over ₹499.">
  <meta property="og:image" content="assets/brand-logo.png">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Collections — Everyday, Elevated | Shop Handcrafted Bags & Accessories">
  <meta name="twitter:description" content="Explore our complete collection of everyday essentials, organic canvas totes, sleek city crossbodies, commuter backpacks, and weekend travel duffels.">
  <meta name="twitter:image" content="assets/brand-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Anybody:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shop.css">
  <script src="js/products.js" defer></script>
  <script src="js/components.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/shop.js" defer></script>
</head>
<body>
  <site-announcement></site-announcement>
  <site-header></site-header>

  <main id="main-content" class="shop-page">
    <div class="container">
      <!-- Breadcrumbs -->
      <nav class="breadcrumbs" aria-label="Breadcrumb">
        <a href="index.html">Home</a>
        <span class="breadcrumbs-sep" aria-hidden="true">/</span>
        <span class="breadcrumbs-current">Collections</span>
      </nav>

      <!-- Shop Page Title Header -->
      <header class="shop-header">
        <div class="eyebrow">Curated Catalog</div>
        <h1>All Collections</h1>
      </header>

      <!-- Mobile Filter Trigger -->
      <div class="mobile-filter-bar">
        <button type="button" class="btn-open-mobile-filter" id="btn-open-mobile-filter">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"/>
            <line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/>
            <line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
          <span>Filter & Sort</span>
        </button>
      </div>

      <!-- Main Shop 2-Column Layout -->
      <div class="shop-layout">
        <!-- Left Column: Filter & Sort Sidebar -->
        <aside class="shop-sidebar" id="shop-sidebar" aria-label="Product filters">
          <div class="sidebar-handle" aria-hidden="true"></div>

          <div class="shop-sidebar__head">
            <h2>Filter & Sort</h2>
            <button type="button" class="btn-reset-filters" id="btn-reset-filters">Clear all</button>
          </div>

          <!-- Sort Select -->
          <div class="filter-group">
            <label class="filter-title" for="sort-by-select">Sort by</label>
            <select id="sort-by-select" class="sort-select">
              <option value="featured">Featured / Bestselling</option>
              <option value="price-low">Price: Low to High</option>
              <option value="price-high">Price: High to Low</option>
              <option value="rating">Highest Customer Rating</option>
              <option value="newest">Newest Arrivals</option>
            </select>
          </div>

          <!-- Category Filter -->
          <div class="filter-group">
            <span class="filter-title">Collections</span>
            <ul class="filter-list">
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="category-filter" value="all" checked>
                  <span>All Collections</span>
                  <span class="count">(8)</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="category-filter" value="Everyday essentials">
                  <span>Everyday Essentials</span>
                  <span class="count">(2)</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="category-filter" value="On the go">
                  <span>On The Go</span>
                  <span class="count">(2)</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="category-filter" value="Travel edit">
                  <span>Travel Edit</span>
                  <span class="count">(1)</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="category-filter" value="Finishing touches">
                  <span>Finishing Touches</span>
                  <span class="count">(2)</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="category-filter" value="Work & travel">
                  <span>Work & Travel</span>
                  <span class="count">(1)</span>
                </label>
              </li>
            </ul>
          </div>

          <!-- Price Range Filter -->
          <div class="filter-group">
            <span class="filter-title">Price Range</span>
            <div class="price-chips">
              <button type="button" class="price-chip is-active" data-price="all">All</button>
              <button type="button" class="price-chip" data-price="under-40">Under ₹40</button>
              <button type="button" class="price-chip" data-price="40-60">₹40 – ₹60</button>
              <button type="button" class="price-chip" data-price="over-60">Over ₹60</button>
            </div>
          </div>

          <!-- Availability & Badges Filter -->
          <div class="filter-group">
            <span class="filter-title">Availability</span>
            <ul class="filter-list">
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="avail-filter" value="all" checked>
                  <span>All Items</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="avail-filter" value="bestseller">
                  <span>Bestsellers</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="avail-filter" value="new">
                  <span>New Arrivals</span>
                </label>
              </li>
              <li>
                <label class="filter-checkbox">
                  <input type="radio" name="avail-filter" value="sale">
                  <span>On Sale</span>
                </label>
              </li>
            </ul>
          </div>

          <!-- Color Swatch Filter -->
          <div class="filter-group">
            <span class="filter-title">Colour Tone</span>
            <div class="color-swatches-filter">
              <button type="button" class="color-swatch-filter-btn" style="background:#d9cdb8" data-color="Warm Oatmeal" title="Warm Oatmeal" aria-label="Warm Oatmeal"></button>
              <button type="button" class="color-swatch-filter-btn" style="background:#4e5b47" data-color="Olive Green" title="Olive Green" aria-label="Olive Green"></button>
              <button type="button" class="color-swatch-filter-btn" style="background:#26292b" data-color="Midnight Charcoal" title="Midnight Charcoal" aria-label="Midnight Charcoal"></button>
              <button type="button" class="color-swatch-filter-btn" style="background:#9c6644" data-color="Saddle Tan" title="Saddle Tan" aria-label="Saddle Tan"></button>
              <button type="button" class="color-swatch-filter-btn" style="background:#1c1b1a" data-color="Jet Black" title="Jet Black" aria-label="Jet Black"></button>
              <button type="button" class="color-swatch-filter-btn" style="background:#778a75" data-color="Sage Green" title="Sage Green" aria-label="Sage Green"></button>
            </div>
          </div>

          <button type="button" class="btn" id="btn-close-mobile-filter" style="width:100%;display:none;margin-top:10px">
            Apply Filters
          </button>
        </aside>

        <!-- Right Column: Results & Products Grid -->
        <div class="shop-content">
          <!-- Toolbar with Results Count and Grid Level Options -->
          <div class="shop-toolbar">
            <div class="shop-results-count">
              Showing <strong id="product-count">8</strong> products
            </div>

            <!-- Grid Level Switcher Options: 3, 4, 6, table -->
            <div class="grid-level-switcher" role="group" aria-label="Product display layout">
              <span class="grid-switcher-label">View:</span>
              
              <!-- 3 Columns Grid Icon -->
              <button type="button" class="btn-grid-opt" data-grid="3" aria-label="3 columns grid" title="3 Columns Grid">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="2" y="3.5" width="5.3" height="17" rx="1.2"/>
                  <rect x="9.35" y="3.5" width="5.3" height="17" rx="1.2"/>
                  <rect x="16.7" y="3.5" width="5.3" height="17" rx="1.2"/>
                </svg>
              </button>
              
              <!-- 4 Columns Grid Icon -->
              <button type="button" class="btn-grid-opt is-active" data-grid="4" aria-label="4 columns grid" title="4 Columns Grid">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="2" y="3.5" width="3.7" height="17" rx="0.9"/>
                  <rect x="7.5" y="3.5" width="3.7" height="17" rx="0.9"/>
                  <rect x="12.9" y="3.5" width="3.7" height="17" rx="0.9"/>
                  <rect x="18.3" y="3.5" width="3.7" height="17" rx="0.9"/>
                </svg>
              </button>
              
              <!-- 6 Columns Grid Icon -->
              <button type="button" class="btn-grid-opt" data-grid="6" aria-label="6 columns grid" title="6 Columns Grid">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="2" y="3.5" width="2.2" height="17" rx="0.6"/>
                  <rect x="5.6" y="3.5" width="2.2" height="17" rx="0.6"/>
                  <rect x="9.2" y="3.5" width="2.2" height="17" rx="0.6"/>
                  <rect x="12.8" y="3.5" width="2.2" height="17" rx="0.6"/>
                  <rect x="16.4" y="3.5" width="2.2" height="17" rx="0.6"/>
                  <rect x="20" y="3.5" width="2.2" height="17" rx="0.6"/>
                </svg>
              </button>
              
              <!-- Table Format Icon -->
              <button type="button" class="btn-grid-opt" data-grid="table" aria-label="Table list view" title="Table Format View">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="3.5" rx="1"/>
                  <rect x="3" y="10.25" width="18" height="3.5" rx="1"/>
                  <rect x="3" y="16.5" width="18" height="3.5" rx="1"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Active Filter Tags -->
          <div class="active-filters-bar" id="active-filters-bar"></div>

          <!-- Products Grid Container (supports .grid-cols-3, .grid-cols-4, .grid-cols-6, .grid-table) -->
          <div class="shop-grid grid-cols-4" id="shop-products-grid">
            <!-- Dynamically populated via js/shop.js -->
          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
  <site-footer></site-footer>
  <cart-drawer></cart-drawer>
  <quick-view-modal></quick-view-modal>
  <mobile-app-nav></mobile-app-nav>
  <div class="toast" role="status" aria-live="polite"></div>
</body>
</html>
